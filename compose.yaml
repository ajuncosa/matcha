services:
    nginx:
        container_name: "matcha-nginx"
        image: nginx
        volumes:
            - "./nginx/nginx.conf:/etc/nginx/nginx.conf"
        networks:
            - "matcha-net"
        ports:
            - "80:80"
        
    backend:
        container_name: "matcha-back"
        image: oven/bun:1.3
        networks:
            - "matcha-net"
        tty: true
        volumes:
            - "./backend:/home/bun/app"
        command: ["bash"]

    frontend:
        container_name: "matcha-front"
        image: oven/bun:1.3
        networks:
            - "matcha-net"
        tty: true
        volumes:
            - "./frontend:/home/bun/app"
        command: ["bash"]

    database:
        container_name: "matcha-database"
        image: postgres:18.0
        networks:
            - "matcha-net"
        volumes:
            - "db-data:/var/lib/postgresql"
        env_file: "db/.env"

    adminer:
        container_name: "matcha-adminer"
        image: adminer
        networks:
            - "matcha-net"
        ports:
            - 8080:8080

    # Email testing
    mailpit:
        image: axllent/mailpit
        container_name: mailpit
        restart: unless-stopped
        ports:
            - 8025:8025
        environment:
            MP_MAX_MESSAGES: 5000
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        networks:
            - "matcha-net"

networks:
    matcha-net:
        driver: bridge

volumes:
    db-data:
