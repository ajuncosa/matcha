# Production stack. Build & run with:  docker compose up -d --build
# (For local development use ./run-dev.sh, which uses compose.dev.yaml.)
services:
    frontend:
        build:
            context: ./frontend
        image: matcha-frontend
        container_name: matcha-frontend
        ports:
            - "80:80"
        depends_on:
            - backend
        networks:
            - matcha-net
        restart: unless-stopped

    backend:
        build:
            context: ./backend
        image: matcha-backend
        container_name: matcha-backend
        env_file: "./backend/.env"
        depends_on:
            database:
                condition: service_healthy
        volumes:
            # Persist uploaded profile images across restarts/rebuilds.
            - backend-images:/home/bun/app/images
        networks:
            - matcha-net
        restart: unless-stopped

    database:
        image: postgres:18.0
        container_name: matcha-database
        env_file: "./db/.env"
        volumes:
            - db-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -q"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - matcha-net
        restart: unless-stopped

    # Local mail catcher (the backend sends verification/reset emails here).
    # Web UI on :8025 so you can read the links; swap for a real SMTP in a real deploy.
    mailpit:
        image: axllent/mailpit
        container_name: matcha-mailpit
        environment:
            MP_MAX_MESSAGES: 5000
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
            - "8025:8025"
        networks:
            - matcha-net
        restart: unless-stopped

networks:
    matcha-net:
        driver: bridge

volumes:
    db-data:
    backend-images:
